{% extends "base.html" %}
{% block content %}
<article class="post">
  <h1 class="post-title">archives</h1>
  <div class="post-content">
    <ul>
    {% for article in dates %}
      <li>{{ article.date.strftime('%Y-%m-%d') }} :: <a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></li>
    {% endfor %}
    </ul>
  </div>
</article>
{% endblock %}
